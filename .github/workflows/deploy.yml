name: Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "migrations/**"
      - "src/**"
      - "bun.lock"
      - "package.json"
      - "tsconfig.json"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: digikeysearch-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Cloudflare credentials
        run: |
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository or organization secret."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository or organization secret."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check

      - name: Apply migrations and deploy Worker
        run: bun run deploy
